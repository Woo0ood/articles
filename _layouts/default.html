<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.original_url | default: page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  {% if page.layout == 'post' %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header shell">
    <a class="wordmark" href="{{ '/' | relative_url }}">Wood<span> / 文章</span></a>
    <nav aria-label="站点导航"><a href="https://v2c.life">博客</a><a href="https://github.com/Woo0ood/articles">GitHub</a></nav>
  </header>
  <main id="main" class="shell">{{ content }}</main>
  <footer class="site-footer shell"><span>Wood 的文章</span><a href="{{ '/' | relative_url }}">所有文章</a></footer>
</body>
</html>
